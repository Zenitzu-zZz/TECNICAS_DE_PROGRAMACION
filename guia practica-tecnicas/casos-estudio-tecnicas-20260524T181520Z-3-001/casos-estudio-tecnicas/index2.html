<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso de Estudio 2</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="2">Caso de Estudio 2: Clínica Dental</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Dimension ...</td>
                <td>
                    <select id="id-select-ejemplo">
                        <option value="7" selected>7</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-cargar-ejemplo">Cargar Datos Aleatorios</button>
                </td>
                <td>
                    <textarea id="id-txt-datos-cargados" rows="3" readonly></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-presentar-promedio">Presentar Promedio</button>
                </td>
                <td>
                    <input type="text" id="id-txt-presentar-promedio" readonly>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-superior-promedio">Presentar Superior Promedio</button>
                </td>
                <td>
                    <input type="text" id="id-txt-superior-promedio" readonly>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-presentar-critico">Presentar Demanda Crítica</button>
                </td>
                <td>
                    <input type="text" id="id-txt-presentar-critico" readonly>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-presentar-ejemplo">Presentar Porcentajes</button>
                </td>
                <td>
                    <textarea id="id-listado-ejemplo" rows="8" readonly></textarea>
                </td>
            </tr>
        </tbody>
    </table>

    <script type="module" src="js/app2.js"></script>
</body>
</html>
